[project]
name = "todo-app"
version = "0.1.0"
description = "A simple command-line todo list application."
authors = [
    { name = "prafdin", email = "pravdin.biss@gmail.com" },
    { name = "gemini", email = "ai@microsoft.com" }
]
dependencies = [
    "typer[all]>=0.9.0",
    "pydantic>=2.0.0",
]
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

[project.scripts]
todo = "todo_app.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["todo_app*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"] # Standard flake8 rules + isort
